<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Jobs | LocalHire</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/escrow.css">
</head>
<body>

    <div id="navbar-container"></div>

    <div class="container" style="padding: 3rem 1.5rem;">
        
        <div class="flex items-center justify-between" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-light); padding-bottom: 1.5rem;">
            <div>
                <h2>My Dashboard</h2>
                <p class="text-muted">Manage jobs and saved workers.</p>
            </div>
            <a href="post-job.html" class="btn btn-primary" id="btn-post" style="display: none;">Post New Job</a>
        </div>

        <!-- Dashboard Tabs -->
        <div class="flex gap-4" style="margin-bottom: 2rem; border-bottom: 1px solid var(--border-light);" id="tab-container">
            <button id="tab-myjobs" class="btn" style="background: transparent; border-radius: 0; padding: 0.75rem 0; border-bottom: 2px solid var(--primary); color: var(--text-main);">My Jobs</button>
            <button id="tab-saved" class="btn text-muted" style="background: transparent; border-radius: 0; padding: 0.75rem 0; font-weight: 500;">Saved Workers</button>
            <button id="tab-apps" class="btn text-muted" style="display: none; background: transparent; border-radius: 0; padding: 0.75rem 0; font-weight: 500;">Applications</button>
        </div>

        <!-- Views -->
        <div id="view-myjobs" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Jobs populated via JS -->
        </div>

        <div id="view-saved" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" style="display: none;">
            <!-- Saved workers populated via JS -->
        </div>

        <div id="view-apps" style="display: none; padding: 1rem 0;">
            <!-- Applications populated via JS -->
            <div id="apps-container" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
            
            <div id="no-apps" style="display: none; text-align: center; padding: 4rem 2rem;" class="glass-card">
                <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                <h3>No applications yet</h3>
                <p class="text-muted">Jobs you apply to will show up here.</p>
                <a href="jobs.html" class="btn btn-primary" style="margin-top: 1rem;">Browse Jobs</a>
            </div>
        </div>

        <!-- Customer Applications Modal -->
        <div id="customer-apps-modal" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center;">
            <div class="glass-card animate-fade-in flex flex-col" style="width: 100%; max-width: 600px; max-height: 80vh; padding: 2.5rem;">
                <div class="flex justify-between items-start" style="margin-bottom: 1.5rem; flex-shrink: 0;">
                    <h3 style="margin: 0; font-size: 1.5rem;">Quotes Received</h3>
                    <button type="button" class="btn" id="close-customer-apps" style="padding: 0; background: transparent; color: var(--text-muted);">&times;</button>
                </div>
                
                <p id="modal-job-title" style="font-weight: 500; margin-bottom: 1.5rem; flex-shrink: 0;"></p>

                <div id="modal-apps-list" style="overflow-y: auto; flex-grow: 1; padding-right: 0.5rem;" class="flex flex-col gap-4">
                    <!-- Populated via JS -->
                </div>
            </div>
        </div>
        
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/escrow.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            renderNavbar('navbar-container', 'pages');

            const user = window.localHireApp.getCurrentUser();
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }

            const trackingSockets = new Map();

            function updateTrackingCard(bookingId, text, badgeText = 'Live') {
                const statusEl = document.querySelector(`[data-tracking-status="${bookingId}"]`);
                const badgeEl = document.querySelector(`[data-tracking-badge="${bookingId}"]`);
                if (statusEl) statusEl.textContent = text;
                if (badgeEl) {
                    badgeEl.textContent = badgeText;
                    badgeEl.style.background = badgeText === 'Live' ? 'rgba(34, 197, 94, 0.15)' : 'rgba(148, 163, 184, 0.12)';
                    badgeEl.style.color = badgeText === 'Live' ? '#4ade80' : 'var(--text-muted)';
                }
            }

            function ensureTrackingSocket(bookingId, role, handlers = {}) {
                const key = `${role}:${bookingId}`;
                if (trackingSockets.has(key)) {
                    const socket = trackingSockets.get(key);
                    if (handlers.onState && socket) {
                        socket.off('tracking:state', handlers.onState);
                        socket.off('tracking:location', handlers.onLocation);
                        socket.off('tracking:stopped', handlers.onStopped);
                        socket.off('tracking:error', handlers.onError);
                    }
                    socket.on('tracking:state', handlers.onState || (() => {}));
                    socket.on('tracking:location', handlers.onLocation || (() => {}));
                    socket.on('tracking:stopped', handlers.onStopped || (() => {}));
                    socket.on('tracking:error', handlers.onError || (() => {}));
                    return socket;
                }

                const socket = window.localHireAPI && window.localHireAPI.tracking ? window.localHireAPI.tracking.connect(bookingId, handlers) : null;
                if (!socket) return null;
                trackingSockets.set(key, socket);
                return socket;
            }

            // Helper to render booking cards
            function createBookingCard(booking, role) {
                const isWorker = role === 'Worker';
                const otherPerson = isWorker ? booking.customer : booking.worker;
                const otherName = otherPerson ? otherPerson.name : (isWorker ? 'Customer' : 'Professional');
                const otherAvatar = otherPerson && otherPerson.avatarUrl ? otherPerson.avatarUrl : `https://api.dicebear.com/7.x/avataaars/svg?seed=${otherName}`;
                const scheduledDate = new Date(booking.scheduledAt).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
                const isTrackingStatus = booking.status === 'IN_PROGRESS' || booking.status === 'DISPATCHED';
                
                let badgeClass = 'badge';
                let statusLabel = booking.status;
                if (booking.status === 'REQUESTED') {
                    badgeClass = 'badge';
                    statusLabel = 'Requested';
                } else if (booking.status === 'CONFIRMED') {
                    badgeClass = 'badge-primary';
                    statusLabel = 'Confirmed';
                } else if (booking.status === 'IN_PROGRESS') {
                    badgeClass = 'badge-primary';
                    statusLabel = 'In Progress';
                } else if (booking.status === 'AWAITING_CUSTOMER_CONFIRMATION') {
                    badgeClass = 'badge';
                    statusLabel = 'Awaiting Customer Confirmation';
                } else if (booking.status === 'COMPLETED') {
                    badgeClass = 'badge';
                    statusLabel = 'Completed';
                } else if (booking.status === 'CANCELLED') {
                    badgeClass = 'badge';
                    statusLabel = 'Cancelled';
                }

                let actionButtons = '';
                if (isWorker) {
                    if (booking.status === 'REQUESTED') {
                        actionButtons = `
                            <div class="flex gap-2" style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem;">
                                <button class="btn btn-primary btn-booking-action" data-booking-id="${booking.id}" data-action="CONFIRMED" style="flex: 1; padding: 0.5rem 1rem; font-size: 0.85rem;">
                                    Accept Booking
                                </button>
                                <button class="btn btn-outline btn-booking-action" data-booking-id="${booking.id}" data-action="CANCELLED" style="padding: 0.5rem 1rem; font-size: 0.85rem; color: var(--danger); border-color: var(--danger);">
                                    Decline
                                </button>
                            </div>
                        `;
                    } else if (booking.status === 'CONFIRMED' || booking.status === 'DISPATCHED') {
                        actionButtons = `
                            <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem;">
                                <button class="btn btn-primary btn-booking-action" data-booking-id="${booking.id}" data-action="IN_PROGRESS" style="width: 100%; padding: 0.5rem 1rem; font-size: 0.85rem;">
                                    Start Service
                                </button>
                            </div>
                        `;
                    } else if (booking.status === 'IN_PROGRESS') {
                        actionButtons = `
                            <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem;">
                                <button class="btn btn-primary btn-booking-action" data-booking-id="${booking.id}" data-action="COMPLETED" style="width: 100%; padding: 0.5rem 1rem; font-size: 0.85rem; background: #22c55e; border-color: #22c55e;">
                                    Mark Complete
                                </button>
                            </div>
                        `;
                    } else if (booking.status === 'AWAITING_CUSTOMER_CONFIRMATION') {
                        actionButtons = `
                            <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem;">
                                <div class="text-muted" style="font-size: 0.8rem; text-align: center;">Awaiting customer confirmation</div>
                            </div>
                        `;
                    }
                } else {
                    if (booking.status === 'REQUESTED' || booking.status === 'CONFIRMED' || booking.status === 'DISPATCHED') {
                        actionButtons = `
                            <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem; text-align: right;">
                                <button class="btn btn-outline btn-booking-action" data-booking-id="${booking.id}" data-action="CANCELLED" style="padding: 0.45rem 1rem; font-size: 0.8rem; color: var(--danger); border-color: var(--danger);">
                                    Cancel Booking
                                </button>
                            </div>
                        `;
                    } else if (booking.status === 'IN_PROGRESS') {
                        actionButtons = `
                            <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem; text-align: right;">
                                <button class="btn btn-primary btn-booking-action" data-booking-id="${booking.id}" data-action="COMPLETED" style="padding: 0.45rem 1rem; font-size: 0.8rem;">
                                    Confirm Completion
                                </button>
                            </div>
                        `;
                    }
                }

                const trackingWidget = isTrackingStatus ? `
                    <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem;">
                        <div class="flex items-center justify-between" style="margin-bottom: 0.5rem;">
                            <span class="text-muted" style="font-size: 0.8rem;">Live GPS</span>
                            <span class="badge" data-tracking-badge="${booking.id}" style="font-size: 0.72rem;">Waiting</span>
                        </div>
                        <div class="text-muted" data-tracking-status="${booking.id}" style="font-size: 0.8rem; line-height: 1.5; min-height: 1.5em;">
                            ${isWorker ? 'Start live sharing when you are on-site.' : 'Waiting for the worker to share a live location.'}
                        </div>
                        <button class="btn ${isWorker ? 'btn-primary' : 'btn-outline'} tracking-action-btn" data-booking-id="${booking.id}" data-role="${role}" data-mode="${isWorker ? 'start' : 'subscribe'}" style="width: 100%; margin-top: 0.75rem; padding: 0.6rem 1rem; font-size: 0.8rem;">
                            ${isWorker ? 'Start Live Tracking' : 'View live location'}
                        </button>
                    </div>
                ` : '';

                return `
                    <div class="glass-card flex-col gap-4 animate-fade-in" style="border: 1px solid var(--border-light);">
                        <div class="flex justify-between items-start">
                            <div>
                                <span style="font-family: monospace; font-size: 0.8rem; color: var(--primary); font-weight: 700;">${booking.bookingNumber || 'BK-DIRECT'}</span>
                                <h4 style="margin: 0.25rem 0 0 0; font-size: 1.1rem; color: var(--text-main);">${isWorker ? 'Booking from ' + otherName : 'Hired ' + otherName}</h4>
                            </div>
                            <span class="${badgeClass}" style="white-space: nowrap;">${statusLabel}</span>
                        </div>

                        <div class="flex items-center gap-3" style="padding: 0.5rem 0;">
                            <img src="${otherAvatar}" style="width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--primary); object-fit: cover;">
                            <div style="font-size: 0.85rem; line-height: 1.4;">
                                <strong style="color: var(--text-main); display: block;">${otherName}</strong>
                                <span class="text-muted">${isWorker ? (booking.customer && booking.customer.email ? booking.customer.email : 'Verified Customer') : (booking.worker && booking.worker.category ? booking.worker.category : 'Service Professional')}</span>
                            </div>
                        </div>

                        <div class="flex flex-col gap-2" style="font-size: 0.85rem; background: rgba(0,0,0,0.03); padding: 0.75rem; border-radius: 8px;">
                            <div class="flex items-center gap-2 text-muted">
                                <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                <span><strong>Date:</strong> ${scheduledDate} (${booking.timeSlot || 'Flexible'})</span>
                            </div>
                            <div class="flex items-center gap-2 text-muted">
                                <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
                                <span><strong>Agreed Rate:</strong> <strong style="color: var(--text-main);">₹${booking.agreedPrice}</strong></span>
                            </div>
                        </div>

                        ${trackingWidget}
                        ${actionButtons}
                    </div>
                `;
            }

            // UI Elements
            const btnPost = document.getElementById('btn-post');
            const tabMyJobs = document.getElementById('tab-myjobs');
            const tabSaved = document.getElementById('tab-saved');
            const tabApps = document.getElementById('tab-apps');
            const viewMyJobs = document.getElementById('view-myjobs');
            const viewSaved = document.getElementById('view-saved');
            const viewApps = document.getElementById('view-apps');

            // Role specific logic
            if (user.role === 'Customer') {
                btnPost.style.display = 'inline-flex';
                tabSaved.style.display = 'inline-block';
                tabApps.style.display = 'none';
            } else if (user.role === 'Worker') {
                btnPost.style.display = 'none';
                tabSaved.style.display = 'none';
                tabMyJobs.textContent = 'Active Contracts';
                tabApps.style.display = 'inline-block';
            }

            // Tab Switching Logic
            function setActiveTab(tabBtn, viewDiv) {
                [tabMyJobs, tabSaved, tabApps].forEach(t => {
                    t.style.borderBottom = 'none';
                    t.style.color = 'var(--text-muted)';
                });
                tabBtn.style.borderBottom = '2px solid var(--primary)';
                tabBtn.style.color = 'var(--text-main)';

                [viewMyJobs, viewSaved, viewApps].forEach(v => v.style.display = 'none');
                
                if (viewDiv.id === 'view-apps' || viewDiv.innerHTML.includes('No jobs') || viewDiv.innerHTML.includes('No saved') || viewDiv.innerHTML.includes('No active contracts')) {
                    viewDiv.style.display = 'block';
                } else {
                    viewDiv.style.display = 'grid';
                }
            }

            tabMyJobs.addEventListener('click', () => setActiveTab(tabMyJobs, viewMyJobs));
            if (tabSaved) tabSaved.addEventListener('click', () => setActiveTab(tabSaved, viewSaved));
            if (tabApps) tabApps.addEventListener('click', () => setActiveTab(tabApps, viewApps));

            // Delegate booking action button clicks (Accept, Start, Complete, Cancel)
            viewMyJobs.addEventListener('click', async (e) => {
                const actionBtn = e.target.closest('.btn-booking-action');
                if (actionBtn) {
                    const bookingId = actionBtn.getAttribute('data-booking-id');
                    const targetStatus = actionBtn.getAttribute('data-action');
                    if (!confirm(`Are you sure you want to mark this booking as ${targetStatus}?`)) return;

                    actionBtn.disabled = true;
                    actionBtn.textContent = 'Updating...';

                    const updateRes = await window.localHireAPI.updateBookingStatus(bookingId, targetStatus);
                    if (updateRes && updateRes.success) {
                        alert(`✅ Booking status updated to ${targetStatus}!`);
                        window.location.reload();
                    } else {
                        alert(`❌ Could not update booking status: ${updateRes ? updateRes.message : 'Database unavailable'}`);
                        actionBtn.disabled = false;
                    }
                }

                const trackingBtn = e.target.closest('.tracking-action-btn');
                if (trackingBtn) {
                    const bookingId = trackingBtn.getAttribute('data-booking-id');
                    const role = trackingBtn.getAttribute('data-role');
                    const mode = trackingBtn.getAttribute('data-mode');
                    const socket = window.localHireAPI && window.localHireAPI.tracking ? window.localHireAPI.tracking.connect(bookingId, {
                        onState: (payload) => {
                            if (payload && payload.bookingId === bookingId) {
                                const activeText = payload.active ? 'Tracking active' : 'Tracking not active';
                                updateTrackingCard(bookingId, payload.message || activeText, payload.active ? 'Live' : 'Waiting');
                            }
                        },
                        onLocation: (payload) => {
                            if (payload && payload.bookingId === bookingId && payload.location) {
                                updateTrackingCard(bookingId, `Worker is at ${payload.location.latitude.toFixed(5)}, ${payload.location.longitude.toFixed(5)} (${payload.location.accuracy ? Math.round(payload.location.accuracy) + 'm accuracy' : 'live'})`, 'Live');
                            }
                        },
                        onStopped: (payload) => {
                            if (payload && payload.bookingId === bookingId) {
                                updateTrackingCard(bookingId, payload.message || 'Tracking stopped.', 'Paused');
                            }
                        },
                        onError: (payload) => {
                            if (payload && payload.bookingId === bookingId) {
                                updateTrackingCard(bookingId, payload.message || 'Tracking unavailable.', 'Error');
                            }
                        }
                    }) : null;

                    if (!socket) {
                        alert('The real-time tracking socket is not available in this browser session.');
                        return;
                    }

                    if (role === 'Worker') {
                        if (mode === 'start') {
                            socket.emit('tracking:start', { bookingId });
                            trackingBtn.setAttribute('data-mode', 'stop');
                            trackingBtn.textContent = 'Stop Live Tracking';
                            updateTrackingCard(bookingId, 'Live tracking started. Your location is now being shared.', 'Live');
                            window.localHireAPI.tracking.watchBrowserLocation(bookingId, {
                                onLocation: (locPayload) => {
                                    if (locPayload && locPayload.bookingId === bookingId) {
                                        window.localHireAPI.tracking.updateLocation(bookingId, locPayload.latitude, locPayload.longitude, locPayload.accuracy || null);
                                    }
                                },
                                onError: (errorPayload) => {
                                    if (errorPayload && errorPayload.bookingId === bookingId) {
                                        updateTrackingCard(bookingId, errorPayload.message || 'Location access is unavailable.', 'Error');
                                    }
                                }
                            });
                        } else {
                            socket.emit('tracking:stop', { bookingId });
                            trackingBtn.setAttribute('data-mode', 'start');
                            trackingBtn.textContent = 'Start Live Tracking';
                            updateTrackingCard(bookingId, 'Live tracking stopped.', 'Paused');
                            window.localHireAPI.tracking.stopBrowserWatch(bookingId);
                        }
                    } else {
                        socket.emit('tracking:subscribe', { bookingId });
                        updateTrackingCard(bookingId, 'Subscribed to live worker location. Waiting for updates…', 'Live');
                        trackingBtn.textContent = 'Refresh Live Location';
                    }
                }
            });

            // Retrieve persistent bookings from backend (PostgreSQL / Prisma)
            const bookingRes = await window.localHireAPI.getMyBookings();
            const myBookings = (bookingRes && bookingRes.success) ? (bookingRes.bookings || []) : [];

            // Load jobs from the live backend instead of stale localStorage data so customer
            // and worker records match the PostgreSQL / Prisma database.
            const allJobs = await window.localHireAPI.getJobs();
            let myJobs = [];
            if (user.role === 'Worker') {
                // Workers see jobs assigned to their user ID or user name
                myJobs = allJobs.filter(j => j.assignedWorker === user.id || j.assignedWorker === user.name);
            } else {
                // Customers see jobs posted by them
                myJobs = allJobs.filter(j => j.customerId === user.id || j.customerName === user.name);
            }

            const totalCount = myBookings.length + myJobs.length;

            if (totalCount === 0) {
                viewMyJobs.innerHTML = `
                    <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem;" class="glass-card">
                        <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                        <h3>${user.role === 'Worker' ? 'No active contracts yet' : 'No jobs or bookings found'}</h3>
                        <p class="text-muted" style="margin-bottom: 1.5rem;">${user.role === 'Worker' ? 'When a customer hires you, your assigned bookings and contracts will appear here.' : 'You do not have any active service bookings or requests.'}</p>
                        ${user.role === 'Customer' ? `<a href="search.html" class="btn btn-primary" style="margin-right: 0.5rem;">Find Workers</a><a href="post-job.html" class="btn btn-outline">Post a Job</a>` : `<a href="jobs.html" class="btn btn-primary">Browse Available Jobs</a>`}
                    </div>
                `;
                viewMyJobs.style.display = 'block';
            } else {
                viewMyJobs.innerHTML = '';

                // 1. Render Bookings (PostgreSQL / Prisma)
                myBookings.forEach(booking => {
                    viewMyJobs.innerHTML += createBookingCard(booking, user.role);
                });

                // 2. Render Jobs (Job posts or assigned jobs)
                const jobsWithQuoteCounts = await Promise.all(myJobs.map(async (job) => {
                    let appCount = 0;
                    if (user.role === 'Customer') {
                        try {
                            const apps = await window.localHireAPI.getApplicationsForJob(job.id);
                            appCount = Array.isArray(apps) ? apps.length : 0;
                        } catch (error) {
                            appCount = 0;
                        }
                    }
                    return { ...job, appCount };
                }));

                jobsWithQuoteCounts.forEach(job => {
                    let cardHtml = createJobCard(job);
                    
                    if (user.role === 'Customer') {
                        const appCount = job.appCount || 0;
                        
                        const wrapper = document.createElement('div');
                        wrapper.innerHTML = cardHtml;
                        const cardDiv = wrapper.firstElementChild;
                        
                        let actionHtml = '';
                        if (job.status === 'In Progress') {
                            actionHtml = `
                                <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem; display: flex; flex-direction: column; gap: 0.5rem;">
                                    <span class="escrow-badge escrow-held" style="align-self: flex-start;">🔒 Payment Locked in Escrow</span>
                                    <button class="btn btn-primary release-escrow-btn" style="width: 100%; font-size: 0.85rem;" onclick="window.LocalHireEscrow.releasePayment('${job.id}')">
                                        Release Payment & Complete Job
                                    </button>
                                </div>
                            `;
                        } else {
                            actionHtml = `
                                <div style="margin-top: 1rem; border-top: 1px dashed var(--border-light); padding-top: 1rem;">
                                    <button class="btn btn-outline view-quotes-btn" style="width: 100%; border-color: var(--primary); color: var(--primary);" data-job-id="${job.id}" data-job-title="${job.title}">
                                        View Quotes (${appCount})
                                    </button>
                                </div>
                            `;
                        }
                        cardDiv.innerHTML += actionHtml;
                        viewMyJobs.appendChild(cardDiv);
                    } else {
                        viewMyJobs.innerHTML += cardHtml;
                    }
                });
            }

            // Load Saved Workers (if Customer)
            if (user.role === 'Customer') {
                const users = window.localHireApp.getUsers();
                const freshUser = users.find(u => u.id === user.id) || { favorites: [] };
                const savedWorkers = Array.isArray(freshUser.favorites) ? freshUser.favorites : [];
                
                if (savedWorkers.length === 0) {
                    viewSaved.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 4rem 2rem;" class="glass-card">
                            <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                            <h3>No saved workers</h3>
                            <p class="text-muted" style="margin-bottom: 1.5rem;">Browse and save your favorite professionals for quick access later.</p>
                            <a href="search.html" class="btn btn-outline">Find Workers</a>
                        </div>
                    `;
                } else {
                    savedWorkers.forEach(workerId => {
                        const worker = window.localHireApp.getWorkerById(workerId);
                        if (worker) {
                            viewSaved.innerHTML += createWorkerCard(worker);
                        }
                    });
                }
            }

            // Customer Modal Logic
            if (user.role === 'Customer') {
                const modal = document.getElementById('customer-apps-modal');
                const closeBtn = document.getElementById('close-customer-apps');
                const modalTitle = document.getElementById('modal-job-title');
                const modalList = document.getElementById('modal-apps-list');

                // Bind View Quotes buttons using event delegation since they are added dynamically
                viewMyJobs.addEventListener('click', async (e) => {
                    const btn = e.target.closest('.view-quotes-btn');
                    if (btn) {
                        const jobId = btn.getAttribute('data-job-id');
                        const jobTitle = btn.getAttribute('data-job-title');
                        
                        modalTitle.textContent = `For: ${jobTitle}`;
                        modalList.innerHTML = '';
                        
                        const apps = await window.localHireAPI.getApplicationsForJob(jobId);
                        if (!apps || apps.length === 0) {
                            modalList.innerHTML = `<p class="text-muted" style="text-align: center; padding: 2rem;">No quotes received yet.</p>`;
                        } else {
                            apps.forEach(app => {
                                modalList.innerHTML += `
                                    <div class="glass-card" style="padding: 1.5rem; background: var(--surface-light); border: 1px solid var(--border-light);">
                                        <div class="flex justify-between items-start" style="margin-bottom: 1rem;">
                                            <div class="flex items-center gap-3">
                                                <img src="${app.workerAvatar || ''}" style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--primary);">
                                                <div>
                                                    <h4 style="margin: 0; font-size: 1.1rem; color: var(--text-main);">${app.workerName || 'Worker'}</h4>
                                                    <a href="profile.html?id=${app.workerId}" style="font-size: 0.8rem; color: var(--primary); text-decoration: none;">View Profile</a>
                                                </div>
                                            </div>
                                            <div class="flex flex-col items-end">
                                                <span style="font-size: 1.2rem; font-weight: bold; color: var(--secondary);">${app.quote}</span>
                                                <span class="badge" style="margin-top: 0.25rem;">${app.status || 'Pending'}</span>
                                            </div>
                                        </div>
                                        <p style="font-size: 0.95rem; margin: 0; color: var(--text-main); padding: 1rem; background: rgba(0,0,0,0.05); border-radius: 8px;">"${app.message}"</p>
                                        <div style="margin-top: 1rem; text-align: right;">
                                            <button class="btn btn-primary accept-quote-btn" data-app-id="${app.id}" data-job-id="${jobId}" style="padding: 0.5rem 1.25rem; font-size: 0.85rem;">
                                                Accept Quote & Hire
                                            </button>
                                        </div>
                                    </div>
                                `;
                            });
                        }
                        
                        modal.style.display = 'flex';
                    }
                });

                modalList.addEventListener('click', async (e) => {
                    const acceptBtn = e.target.closest('.accept-quote-btn');
                    if (acceptBtn) {
                        const jobId = acceptBtn.getAttribute('data-job-id');
                        const appId = acceptBtn.getAttribute('data-app-id');
                        const apps = await window.localHireAPI.getApplicationsForJob(jobId);
                        const app = Array.isArray(apps) ? apps.find(a => a.id === appId) : null;
                        const workerId = app ? app.workerId : 'w1';
                        const amount = Number(app ? app.quote : 500) || 500;

                        modal.style.display = 'none';

                        const acceptResult = await window.localHireAPI.acceptQuote(appId);
                        if (!acceptResult || !acceptResult.success) {
                            alert(acceptResult?.message || 'Could not accept this quote.');
                            return;
                        }

                        if (window.LocalHireEscrow && window.LocalHireEscrow.openFundModal) {
                            window.LocalHireEscrow.openFundModal(jobId, workerId, amount, () => {
                                alert('✅ Quote accepted & payment locked in Escrow!');
                                window.location.reload();
                            });
                        } else {
                            alert('✅ Quote accepted & payment locked in Escrow!');
                            window.location.reload();
                        }
                    }
                });

                closeBtn.addEventListener('click', () => {
                    modal.style.display = 'none';
                });
            }

            // Load Applications (if Worker)
            if (user.role === 'Worker') {
                (async () => {
                    const viewAppsContainer = document.getElementById('apps-container');
                    const noApps = document.getElementById('no-apps');
                    
                    const myApps = await window.localHireAPI.getWorkerApplications();
                    if (!myApps || myApps.length === 0) {
                        viewAppsContainer.style.display = 'none';
                        noApps.style.display = 'block';
                    } else {
                        viewAppsContainer.style.display = 'grid';
                        noApps.style.display = 'none';
                        viewAppsContainer.innerHTML = '';
                        
                        const allJobs = await window.localHireAPI.getJobs();
                        
                        myApps.forEach(app => {
                            const job = allJobs.find(j => j.id === app.jobId);
                            if (job) {
                                viewAppsContainer.innerHTML += `
                                    <div class="glass-card flex-col gap-3">
                                        <div class="flex justify-between items-start">
                                            <h4 style="margin: 0; color: var(--primary);">${job.title}</h4>
                                            <span class="badge badge-primary">${app.status || 'Pending'}</span>
                                        </div>
                                        <p class="text-muted" style="margin: 0; font-size: 0.9rem;">To: ${job.customerName}</p>
                                        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-light);">
                                            <p style="margin: 0 0 0.5rem 0; font-size: 0.85rem; color: var(--text-muted);">Your Quote</p>
                                            <p style="margin: 0; font-weight: bold; color: var(--secondary); font-size: 1.1rem;">${app.quote}</p>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                    }
                })();
            }
        });
    </script>
</body>
</html>
