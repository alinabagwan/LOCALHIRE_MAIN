<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search | LocalHire</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>

    <div id="navbar-container"></div>

    <div class="container" style="padding: 2rem 1.5rem;">
        <div class="flex items-center justify-between" style="margin-bottom: 2rem;">
            <h2>Find Professionals</h2>
            <div class="flex items-center gap-4">
                <div class="flex bg-card p-1 rounded-full" style="background: rgba(15, 23, 42, 0.6); border-radius: 9999px; padding: 4px;">
                    <button id="view-grid" class="btn" style="padding: 0.5rem 1.5rem; border-radius: 9999px; background: var(--primary); color: white;">List View</button>
                    <button id="view-map" class="btn text-muted" style="padding: 0.5rem 1.5rem; border-radius: 9999px; background: transparent;">Map View</button>
                </div>
                <div class="glass-card" style="padding: 0.5rem 1rem; border-radius: 9999px;">
                    <span id="results-count" class="text-muted">Loading results...</span>
                </div>
            </div>
        </div>

        <div class="flex gap-8" style="flex-wrap: wrap;">
            
            <!-- Sidebar Filters -->
            <aside style="width: 100%; max-width: 280px; flex-shrink: 0;">
                <div class="glass-card" style="position: sticky; top: 100px;">
                    <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;">Filters</h3>
                    
                    <div class="input-group">
                        <label class="input-label">Keywords</label>
                        <input type="text" id="filter-q" class="input-control" placeholder="E.g. Plumber, Math, Electrician">
                    </div>
                    
                    <div class="input-group" style="margin-top: 1rem;">
                        <label class="input-label">Location</label>
                        <input type="text" id="filter-loc" class="input-control" placeholder="Anywhere">
                    </div>

                    <div class="input-group" style="margin-top: 1.5rem;">
                        <label class="input-label">Category</label>
                        <select id="filter-category" class="input-control" style="appearance: none; background-image: url('data:image/svg+xml;utf8,<svg fill=%22%2394a3b8%22 viewBox=%220 0 24 24%22 width=%2224%22 height=%2224%22><path d=%22M7 10l5 5 5-5z%22/></svg>'); background-repeat: no-repeat; background-position: right 1rem center;">
                            <option value="">All Categories</option>
                            <option value="Tutor">Tutor</option>
                            <option value="Electrician">Electrician</option>
                            <option value="Plumber">Plumber</option>
                            <option value="Cleaner">Cleaner</option>
                            <option value="Driver">Driver</option>
                            <option value="Freelancer">Freelancer</option>
                        </select>
                    </div>

                    <div class="input-group" style="margin-top: 1.5rem;">
                        <label class="input-label">Max Hourly Rate: ₹<span id="price-val">1000</span>+</label>
                        <input type="range" id="filter-price" min="100" max="1500" value="1500" style="width: 100%; accent-color: var(--primary);">
                    </div>

                    <button id="apply-filters" class="btn btn-primary" style="width: 100%; margin-top: 2rem;">Apply Filters</button>
                </div>
            </aside>

            <!-- Main Results -->
            <main style="flex-grow: 1;">
                <div id="search-results" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- Populated via JS -->
                </div>

                <!-- Map View (Hidden by default) -->
                <div id="search-map-container" style="display: none; width: 100%; height: 600px; border-radius: 16px; overflow: hidden; border: 1px solid var(--border-light);">
                    <div id="search-map" style="width: 100%; height: 100%; z-index: 10;"></div>
                </div>
                
                <div id="no-results" style="display: none; text-align: center; padding: 4rem 2rem;" class="glass-card">
                    <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto;" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <h3>No professionals found</h3>
                    <p class="text-muted">Try adjusting your filters or search terms.</p>
                    <button id="clear-filters" class="btn btn-outline" style="margin-top: 1rem;">Clear Filters</button>
                </div>
            </main>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Role Guard: Verify authenticated user role from server or session
            let currentUser = window.localHireApp ? window.localHireApp.getCurrentUser() : null;
            if (window.localHireAPI && window.localHireAPI.getMe) {
                try {
                    const verifiedUser = await window.localHireAPI.getMe();
                    if (verifiedUser) currentUser = verifiedUser;
                } catch (e) {
                    // fallback to session user
                }
            }

            if (currentUser && currentUser.role === 'Worker') {
                alert('Access Restricted: The "Find Workers" directory is reserved for Customer (Hire Worker) accounts. Redirecting to your Job Feed...');
                window.location.replace('jobs.html');
                return;
            }

            renderNavbar('navbar-container', 'pages');

            // Handle query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const initialQ = urlParams.get('q') || '';
            const initialLoc = urlParams.get('loc') || '';

            const qInput = document.getElementById('filter-q');
            const locInput = document.getElementById('filter-loc');
            const catSelect = document.getElementById('filter-category');
            const priceRange = document.getElementById('filter-price');
            const priceVal = document.getElementById('price-val');
            const applyBtn = document.getElementById('apply-filters');
            const clearBtn = document.getElementById('clear-filters');
            const resultsContainer = document.getElementById('search-results');
            const noResults = document.getElementById('no-results');
            const resultsCount = document.getElementById('results-count');

            // View Toggles
            const viewGridBtn = document.getElementById('view-grid');
            const viewMapBtn = document.getElementById('view-map');
            const mapContainer = document.getElementById('search-map-container');
            let isMapView = false;
            let searchMap = null;
            let markerLayer = null;

            viewGridBtn.addEventListener('click', () => {
                isMapView = false;
                viewGridBtn.style.background = 'var(--primary)';
                viewGridBtn.style.color = 'white';
                viewMapBtn.style.background = 'transparent';
                viewMapBtn.classList.add('text-muted');
                viewMapBtn.style.color = '';
                
                mapContainer.style.display = 'none';
                if(resultsContainer.children.length > 0) resultsContainer.style.display = 'grid';
            });

            viewMapBtn.addEventListener('click', () => {
                isMapView = true;
                viewMapBtn.style.background = 'var(--primary)';
                viewMapBtn.style.color = 'white';
                viewMapBtn.classList.remove('text-muted');
                viewGridBtn.style.background = 'transparent';
                viewGridBtn.classList.add('text-muted');
                viewGridBtn.style.color = '';
                
                resultsContainer.style.display = 'none';
                mapContainer.style.display = 'block';
                if (searchMap) searchMap.invalidateSize();
            });

            qInput.value = initialQ;
            locInput.value = initialLoc;

            // Simple categories auto select based on search query
            const lowerQ = initialQ.toLowerCase();
            Array.from(catSelect.options).forEach(opt => {
                if (opt.value && lowerQ.includes(opt.value.toLowerCase())) {
                    catSelect.value = opt.value;
                }
            });

            priceRange.addEventListener('input', (e) => {
                priceVal.textContent = e.target.value == 1500 ? '1500+' : e.target.value;
            });

            async function renderResults() {
                // Secondary Guard: Block display if worker
                const activeUser = window.localHireApp ? window.localHireApp.getCurrentUser() : null;
                if (activeUser && activeUser.role === 'Worker') {
                    resultsContainer.style.display = 'none';
                    mapContainer.style.display = 'none';
                    noResults.style.display = 'block';
                    noResults.innerHTML = `
                        <svg class="icon text-muted" style="width: 48px; height: 48px; margin: 0 auto 1rem auto; color: var(--warning);" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        <h3>Access Restricted</h3>
                        <p class="text-muted">The "Find Workers" directory is reserved for Customer (Hire Worker) accounts.</p>
                        <a href="jobs.html" class="btn btn-primary" style="margin-top: 1rem;">View Available Jobs</a>
                    `;
                    resultsCount.textContent = 'Restricted';
                    return;
                }

                const filterQ = qInput.value.toLowerCase();
                const filterLoc = locInput.value.toLowerCase();
                const filterCat = catSelect.value;
                const filterPrice = parseInt(priceRange.value);

                const workers = await window.localHireAPI.getWorkers({
                  q: qInput.value,
                  category: filterCat,
                  maxPrice: filterPrice === 1500 ? '' : filterPrice
                });

                const filtered = (workers || []).filter(w => {
                    const matchQ = !filterQ || (w.name.toLowerCase().includes(filterQ) || (w.skills && w.skills.some(s => s.toLowerCase().includes(filterQ))) || (w.category && w.category.toLowerCase().includes(filterQ)));
                    const locText = typeof w.location === 'string' ? w.location : (w.location && w.location.address ? w.location.address : '');
                    const matchLoc = !filterLoc || locText.toLowerCase().includes(filterLoc);
                    const matchCat = filterCat === '' || w.category === filterCat;
                    const matchPrice = filterPrice == 1500 || (w.hourlyRate || 0) <= filterPrice;

                    return matchQ && matchLoc && matchCat && matchPrice;
                });

                resultsContainer.innerHTML = '';
                
                if (filtered.length === 0) {
                    resultsContainer.style.display = 'none';
                    mapContainer.style.display = 'none';
                    noResults.style.display = 'block';
                    resultsCount.textContent = '0 results';
                } else {
                    noResults.style.display = 'none';
                    if (isMapView) {
                        mapContainer.style.display = 'block';
                    } else {
                        resultsContainer.style.display = 'grid';
                    }
                    resultsCount.textContent = `${filtered.length} professionals found`;
                    
                    filtered.forEach(worker => {
                        resultsContainer.innerHTML += createWorkerCard(worker);
                    });

                    updateMap(filtered);
                }
            }

            function updateMap(workers) {
                const savedLoc = window.localHireApp.getUserLocation();
                const centerLat = savedLoc ? savedLoc.lat : 15.8497;
                const centerLng = savedLoc ? savedLoc.lng : 74.4977;

                if (!searchMap) {
                    searchMap = L.map('search-map').setView([centerLat, centerLng], 12);
                    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        maxZoom: 19,
                        attribution: '&copy; OpenStreetMap'
                    }).addTo(searchMap);
                    markerLayer = L.layerGroup().addTo(searchMap);
                } else {
                    markerLayer.clearLayers();
                }

                // Add User Marker if we have location
                if (savedLoc) {
                    const userIcon = L.divIcon({
                        className: 'custom-div-icon',
                        html: `<div style="background-color: var(--primary); width: 16px; height: 16px; border-radius: 50%; border: 3px solid white; box-shadow: 0 0 10px rgba(0,0,0,0.5);"></div>`,
                        iconSize: [16, 16],
                        iconAnchor: [8, 8]
                    });
                    L.marker([savedLoc.lat, savedLoc.lng], {icon: userIcon}).bindPopup('<b>You are here</b>').addTo(markerLayer);
                }

                workers.forEach(worker => {
                    const wLat = worker.lat || (worker.location && worker.location.coordinates ? worker.location.coordinates[1] : null);
                    const wLng = worker.lng || (worker.location && worker.location.coordinates ? worker.location.coordinates[0] : null);
                    const locText = typeof worker.location === 'string' ? worker.location : (worker.location && worker.location.address ? worker.location.address : 'Nearby');

                    if (wLat && wLng) {
                        const marker = L.marker([wLat, wLng]).addTo(markerLayer);
                        
                        const popupContent = `
                            <div style="min-width: 200px; display: flex; flex-direction: column; gap: 8px;">
                                <div style="display: flex; align-items: center; gap: 10px;">
                                    <img src="${worker.avatarUrl}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                                    <div>
                                        <h4 style="margin: 0; font-size: 14px;">${worker.name}</h4>
                                        <span style="font-size: 12px; color: #666;">${worker.category} • ${worker.rating}★</span>
                                    </div>
                                </div>
                                <div style="font-size: 12px; color: #444;">Location: ${locText}</div>
                                <a href="profile.html?id=${worker.id || worker._id}" style="display: block; width: 100%; text-align: center; background: var(--primary); color: white; padding: 6px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; margin-top: 5px;">View Profile</a>
                            </div>
                        `;
                        marker.bindPopup(popupContent);
                    }
                });
            }

            applyBtn.addEventListener('click', renderResults);
            
            clearBtn.addEventListener('click', () => {
                qInput.value = '';
                locInput.value = '';
                catSelect.value = '';
                priceRange.value = 1500;
                priceVal.textContent = '1500+';
                renderResults();
            });

            // Initial render
            await renderResults();
        });
    </script>
</body>
</html>
