<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Profile | LocalHire</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/calling.css">
</head>
<body>

    <div id="navbar-container"></div>

    <div class="container" style="padding: 3rem 1.5rem;" id="profile-content">
        <!-- Content injected via JS -->
        <div style="text-align: center; padding: 4rem;">Loading profile...</div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/calling.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            renderNavbar('navbar-container', 'pages');

            const urlParams = new URLSearchParams(window.location.search);
            const workerId = urlParams.get('id');
            const container = document.getElementById('profile-content');

            // Determine role-aware "Back" link — Workers go to jobs.html, Customers/guests go to search.html
            const _currentUser = window.localHireApp.getCurrentUser();
            const _isWorker = _currentUser && _currentUser.role === 'Worker';
            const backHref = _isWorker ? 'jobs.html' : 'search.html';
            const backLabel = _isWorker ? 'Back to Jobs' : 'Back to Search';

            if (!workerId) {
                container.innerHTML = `<div class="glass-card" style="text-align: center; padding: 4rem;"><h2>Worker not found</h2><a href="${backHref}" class="btn btn-primary" style="margin-top: 1rem;">${backLabel}</a></div>`;
                return;
            }

            let worker = null;
            try {
                if (window.localHireAPI && window.localHireAPI.getWorkerById) {
                    worker = await window.localHireAPI.getWorkerById(workerId);
                }

                if (!worker && window.localHireApp) {
                    worker = window.localHireApp.getWorkerById(workerId);
                }
            } catch (error) {
                console.error('[Profile] Worker lookup error:', error);
                worker = null;
            }

            if (!worker) {
                container.innerHTML = `<div class="glass-card" style="text-align: center; padding: 4rem;"><h2>Worker not found</h2><p class="text-muted" style="margin-top: 0.75rem;">The requested worker profile could not be loaded.</p><a href="${backHref}" class="btn btn-primary" style="margin-top: 1rem;">${backLabel}</a></div>`;
                return;
            }

            if (worker && worker.id && worker.id !== workerId) {
                const newUrl = new URL(window.location.href);
                newUrl.searchParams.set('id', worker.id);
                window.history.replaceState({}, '', newUrl.toString());
            }

            try {
                const availabilityText = worker.availability || 'Available Today';
                const isAvailable = typeof availabilityText === 'string' && (availabilityText.includes('Today') || availabilityText.includes('Now'));
                const workerLocationText = typeof worker.location === 'string'
                    ? worker.location
                    : (worker.location && worker.location.address) || 'Nearby';

                const safeName = escapeHTML(worker.name || 'Worker');
                const safeCategory = escapeHTML(worker.category || 'General');
                const safeSubCategory = escapeHTML(worker.subCategory || '');
                const safeBio = escapeHTML(worker.bio || '');
                const safeExperience = escapeHTML(worker.experience || '0 years');
                const safeAvailability = escapeHTML(worker.availability || 'Available Today');
                const safeAvatar = worker.avatarUrl ? escapeHTML(worker.avatarUrl) : `https://api.dicebear.com/7.x/avataaars/svg?seed=${encodeURIComponent(worker.name || 'worker')}`;
                const safeSkills = (worker.skills || []).map(skill => `<span class="badge" style="font-size: 0.85rem; padding: 0.35rem 0.75rem;">${escapeHTML(skill)}</span>`).join('');
                const safeFirstName = escapeHTML((worker.name || 'Worker').split(' ')[0]);

                container.innerHTML = `
                <a href="${backHref}" class="flex items-center gap-1 text-muted hover:text-white" style="text-decoration: none; margin-bottom: 2rem; display: inline-flex;">
                    <svg class="icon" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                    ${backLabel}
                </a>

                <div class="flex gap-8" style="flex-wrap: wrap;">
                    
                    <!-- Left Column: Main Info -->
                    <main style="flex: 1; min-width: 300px;">
                        <div class="glass-card flex items-center gap-6" style="margin-bottom: 2rem; flex-wrap: wrap;">
                            <img src="${safeAvatar}" alt="${safeName}" style="width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--primary); object-fit: cover;">
                            <div style="flex-grow: 1;">
                                <div class="flex justify-between items-start" style="flex-wrap: wrap; gap: 1rem;">
                                    <div>
                                        <h1 style="font-size: 2rem; margin-bottom: 0;">${safeName}</h1>
                                        <p style="font-size: 1.1rem; color: var(--secondary); margin-bottom: 0.5rem;">${safeCategory} ${safeSubCategory ? '- ' + safeSubCategory : ''}</p>
                                        <div class="flex items-center gap-2">
                                            ${renderStars(worker.rating)}
                                            <span style="font-weight: 600;">${Number(worker.rating || 5.0)}</span>
                                            <a href="#reviews" style="color: var(--text-muted); text-decoration: underline;">(${Number(worker.reviewsCount || 0)} reviews)</a>
                                        </div>
                                    </div>
                                    <div style="text-align: right;">
                                        <div style="font-size: 2rem; font-weight: 800; color: var(--text-main);">₹${Number(worker.hourlyRate || 0)}<span style="font-size: 1rem; font-weight: 500; color: var(--text-muted);">/hr</span></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="glass-card" style="margin-bottom: 2rem;">
                            <h3>About</h3>
                            <p style="color: var(--text-muted); line-height: 1.8; margin-top: 1rem; font-size: 1.05rem;">
                                ${safeBio}
                            </p>
                        </div>

                        <div class="glass-card" id="reviews">
                            <h3 style="margin-bottom: 1.5rem;">Recent Reviews</h3>
                            <!-- Mock Reviews -->
                            <div style="border-bottom: 1px solid var(--border-light); padding-bottom: 1.5rem; margin-bottom: 1.5rem;">
                                <div class="flex items-center justify-between" style="margin-bottom: 0.5rem;">
                                    <span style="font-weight: 600;">Excellent service!</span>
                                    <span class="text-muted" style="font-size: 0.85rem;">2 weeks ago</span>
                                </div>
                                <div style="margin-bottom: 0.5rem;">${renderStars(5)}</div>
                                <p class="text-muted" style="font-size: 0.95rem;">${safeName} was incredibly professional and solved my problem in half the time I expected. Highly recommended!</p>
                            </div>
                            <div>
                                <div class="flex items-center justify-between" style="margin-bottom: 0.5rem;">
                                    <span style="font-weight: 600;">Very solid work</span>
                                    <span class="text-muted" style="font-size: 0.85rem;">1 month ago</span>
                                </div>
                                <div style="margin-bottom: 0.5rem;">${renderStars(4.5)}</div>
                                <p class="text-muted" style="font-size: 0.95rem;">Great communication throughout the process. The work quality was exactly what I was hoping for.</p>
                            </div>
                        </div>
                    </main>

                    <!-- Right Column: Actions & Details -->
                    <aside style="width: 100%; max-width: 350px; flex-shrink: 0;">
                        <div class="glass-card" style="position: sticky; top: 100px;">
                            
                            <div style="margin-bottom: 2rem;" id="profile-actions">
                                <!-- Actions injected below -->
                            </div>

                            <div style="margin-bottom: 2rem;">
                                <h4 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-light); padding-bottom: 0.5rem;">Details</h4>
                                
                                <div class="flex items-center gap-3" style="margin-bottom: 1rem;">
                                    <svg class="icon text-muted" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                    <span id="worker-loc"></span>
                                </div>
                                
                                <div class="flex items-center gap-3" style="margin-bottom: 1rem;">
                                    <svg class="icon text-muted" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
                                    <span class="text-muted" style="font-size: 0.9rem;">Service availability within 5-10 km radius</span>
                                </div>
                                <div class="flex items-center gap-3" style="margin-bottom: 1rem;">
                                    <svg class="icon text-muted" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                                    <span class="${isAvailable ? 'text-gradient' : ''}" style="font-weight: 500;">${safeAvailability}</span>
                                </div>
                                
                                <div class="flex items-center gap-3">
                                    <svg class="icon text-muted" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                    <span>${safeExperience} Experience</span>
                                </div>
                            </div>

                            <div>
                                <h4 style="margin-bottom: 1rem; border-bottom: 1px solid var(--border-light); padding-bottom: 0.5rem;">Skills</h4>
                                <div class="flex gap-2" style="flex-wrap: wrap;">
                                    ${safeSkills}
                                </div>
                            </div>

                        </div>
                    </aside>

                </div>
            `;

            // Calculate active distance
            const locSpan = document.getElementById('worker-loc');
            if (worker.lat && worker.lng) {
                const savedLoc = window.localHireApp.getUserLocation();
                if (savedLoc) {
                    const dist = window.localHireApp.calculateDistance(savedLoc.lat, savedLoc.lng, worker.lat, worker.lng);
                    locSpan.textContent = `${dist} km away`;
                } else {
                    locSpan.textContent = workerLocationText;
                }
            } else {
                locSpan.textContent = workerLocationText;
            }

            // Authentication & Actions Injection
            const currentUser = window.localHireApp.getCurrentUser();
            const actionContainer = document.getElementById('profile-actions');
            
            if (currentUser && currentUser.id === worker.id) {
                actionContainer.innerHTML = `
                    <button class="btn btn-outline" onclick="window.location.href='edit-profile.html'" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                        Edit My Profile
                    </button>
                `;
            } else if (currentUser && currentUser.role === 'Customer') {
                const isFav = currentUser.favorites && currentUser.favorites.includes(worker.id);
                const favStyle = isFav ? 'color: #ef4444; border-color: #ef4444; background: rgba(239, 68, 68, 0.1);' : '';
                const favText = isFav ? 'Saved' : 'Save Worker';
                
                actionContainer.innerHTML = `
                    <button id="btn-open-hire-modal" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.1rem; margin-bottom: 0.75rem;">
                        Hire ${safeFirstName} Now
                    </button>
                    <button id="btn-fav" class="btn btn-outline" style="width: 100%; padding: 0.85rem; ${favStyle}">
                        <svg class="icon" viewBox="0 0 24 24" style="margin-right: 0.5rem; ${isFav ? 'fill: currentColor; stroke: none;' : ''}"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                        ${favText}
                    </button>
                    <div class="flex gap-2" style="margin-top: 0.75rem;">
                        <button class="btn btn-outline" id="btn-profile-call" style="flex: 1; padding: 0.85rem; border-color: rgba(34, 197, 94, 0.4); color: #4ade80; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                            <svg style="width: 15px; height: 15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-6-6 19.8 19.8 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91"></path></svg>
                            <span>Call</span>
                        </button>
                        <button class="btn btn-outline" onclick="window.location.href='chat.html?userId=${encodeURIComponent(worker.id || worker._id)}'" style="flex: 1; padding: 0.85rem; border-color: rgba(59, 130, 246, 0.4); color: #60a5fa; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                            <svg style="width: 15px; height: 15px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                            <span>Message</span>
                        </button>
                    </div>
                `;

                // Inject Booking Modal into DOM
                const modalHtml = `
                    <div id="booking-modal" style="display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 1.5rem;">
                        <div class="glass-card animate-fade-in flex flex-col" style="width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 2rem;">
                            <div class="flex justify-between items-start" style="margin-bottom: 1.5rem;">
                                <div>
                                    <h3 style="margin: 0; font-size: 1.35rem;">Hire ${safeName}</h3>
                                    <p class="text-muted" style="margin: 0.25rem 0 0 0; font-size: 0.85rem;">${safeCategory} • Base Rate: ₹${Number(worker.hourlyRate || 0)}/hr</p>
                                </div>
                                <button type="button" class="btn" id="close-booking-modal" style="padding: 0; background: transparent; color: var(--text-muted); font-size: 1.5rem; line-height: 1;">&times;</button>
                            </div>

                            <form id="booking-form" class="flex flex-col gap-4" novalidate>
                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Scheduled Date</label>
                                    <input type="date" id="booking-date" class="input-control" required>
                                </div>

                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Preferred Time Slot</label>
                                    <select id="booking-slot" class="input-control">
                                        <option value="Morning (09:00 - 12:00)">Morning (09:00 - 12:00)</option>
                                        <option value="Afternoon (12:00 - 16:00)" selected>Afternoon (12:00 - 16:00)</option>
                                        <option value="Evening (16:00 - 20:00)">Evening (16:00 - 20:00)</option>
                                        <option value="Flexible">Flexible</option>
                                    </select>
                                </div>

                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Agreed Price (₹)</label>
                                    <input type="number" id="booking-price" class="input-control" value="${worker.hourlyRate || 500}" min="50" step="50" required>
                                    <span class="text-muted" style="font-size: 0.75rem;">Total agreed service amount</span>
                                </div>

                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Service Address</label>
                                    <div id="booking-address-container" class="flex flex-col gap-2">
                                        <select id="booking-address-select" class="input-control">
                                            <option value="">Loading saved addresses...</option>
                                        </select>
                                        <div class="flex gap-2">
                                            <button type="button" id="btn-toggle-address-form" class="btn btn-outline" style="flex: 1; padding: 0.7rem 1rem;">Add a New Address</button>
                                            <button type="button" id="btn-refresh-addresses" class="btn btn-outline" style="padding: 0.7rem 0.9rem;">Refresh</button>
                                        </div>
                                        <div id="booking-address-form" style="display: none; border: 1px solid var(--border-light); border-radius: 12px; padding: 1rem; background: rgba(15, 23, 42, 0.2);">
                                            <div class="grid grid-cols-1 md-grid-cols-2 gap-3">
                                                <div>
                                                    <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem;">Label</label>
                                                    <input type="text" id="address-label" class="input-control" placeholder="Home, Office...">
                                                </div>
                                                <div>
                                                    <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem;">Flat / House No.</label>
                                                    <input type="text" id="address-flat" class="input-control" placeholder="A-204">
                                                </div>
                                                <div class="md:col-span-2">
                                                    <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem;">Street Address</label>
                                                    <input type="text" id="address-street" class="input-control" placeholder="123 Main Road">
                                                </div>
                                                <div>
                                                    <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem;">Landmark</label>
                                                    <input type="text" id="address-landmark" class="input-control" placeholder="Near Metro station">
                                                </div>
                                                <div>
                                                    <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem;">City</label>
                                                    <input type="text" id="address-city" class="input-control" placeholder="Bengaluru">
                                                </div>
                                                <div>
                                                    <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem;">State</label>
                                                    <input type="text" id="address-state" class="input-control" placeholder="Karnataka">
                                                </div>
                                                <div>
                                                    <label style="display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.25rem;">Postal Code</label>
                                                    <input type="text" id="address-postal" class="input-control" placeholder="560001">
                                                </div>
                                            </div>
                                            <div class="flex justify-end" style="margin-top: 0.75rem;">
                                                <button type="button" id="btn-save-address-inline" class="btn btn-primary" style="padding: 0.65rem 1rem;">Save Address</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div>
                                    <label style="display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.35rem;">Job Description / Instructions</label>
                                    <textarea id="booking-notes" class="input-control" rows="3" placeholder="Describe the specific task or issue to resolve..."></textarea>
                                </div>

                                <div id="booking-status-msg" style="display: none; padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.9rem;"></div>

                                <div class="flex gap-3 justify-end" style="margin-top: 0.5rem;">
                                    <button type="button" class="btn btn-outline" id="btn-cancel-booking" style="cursor: pointer;">Cancel</button>
                                    <button type="submit" class="btn btn-primary" id="btn-submit-booking" style="cursor: pointer;">Confirm & Send Request</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', modalHtml);

                // Modal Elements & Handlers
                const bookingModal = document.getElementById('booking-modal');
                const btnOpenHire = document.getElementById('btn-open-hire-modal');
                const btnCloseHire = document.getElementById('close-booking-modal');
                const btnCancelHire = document.getElementById('btn-cancel-booking');
                const bookingForm = document.getElementById('booking-form');
                const bookingDateInput = document.getElementById('booking-date');
                const bookingStatusMsg = document.getElementById('booking-status-msg');
                const btnSubmitBooking = document.getElementById('btn-submit-booking');
                const bookingAddressSelect = document.getElementById('booking-address-select');
                const bookingAddressForm = document.getElementById('booking-address-form');
                const btnToggleAddressForm = document.getElementById('btn-toggle-address-form');
                const btnRefreshAddresses = document.getElementById('btn-refresh-addresses');
                const btnSaveAddressInline = document.getElementById('btn-save-address-inline');

                const loadSavedAddresses = async () => {
                    const result = await window.localHireAPI.getAddresses();
                    const select = bookingAddressSelect;
                    if (!select) return;

                    if (!result || !result.success || !Array.isArray(result.addresses) || result.addresses.length === 0) {
                        select.innerHTML = '<option value="">No saved addresses yet — add one below</option>';
                        return;
                    }

                    const defaultAddress = result.addresses.find(address => address.isDefault) || result.addresses[0];
                    select.innerHTML = result.addresses.map(address => `
                        <option value="${address.id}" ${defaultAddress && address.id === defaultAddress.id ? 'selected' : ''}>
                            ${address.label || 'Address'} — ${address.street}, ${address.city}
                        </option>
                    `).join('');
                };

                const saveInlineAddress = async () => {
                    const payload = {
                        label: document.getElementById('address-label').value.trim() || 'Home',
                        flatNumber: document.getElementById('address-flat').value.trim() || null,
                        street: document.getElementById('address-street').value.trim(),
                        landmark: document.getElementById('address-landmark').value.trim() || null,
                        city: document.getElementById('address-city').value.trim(),
                        state: document.getElementById('address-state').value.trim() || null,
                        postalCode: document.getElementById('address-postal').value.trim(),
                        isDefault: true
                    };

                    if (!payload.street || !payload.city || !payload.postalCode) {
                        alert('Please enter a street, city, and postal code for the new address.');
                        return;
                    }

                    const result = await window.localHireAPI.createAddress(payload);
                    if (!result || !result.success) {
                        alert(result && result.message ? result.message : 'Unable to save the address right now.');
                        return;
                    }

                    bookingAddressForm.style.display = 'none';
                    document.getElementById('address-label').value = '';
                    document.getElementById('address-flat').value = '';
                    document.getElementById('address-street').value = '';
                    document.getElementById('address-landmark').value = '';
                    document.getElementById('address-city').value = '';
                    document.getElementById('address-state').value = '';
                    document.getElementById('address-postal').value = '';
                    await loadSavedAddresses();
                    alert('Address saved successfully.');
                };

                // Default date to tomorrow
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                const minDate = tomorrow.toISOString().split('T')[0];
                bookingDateInput.min = minDate;
                bookingDateInput.value = minDate;

                btnOpenHire.addEventListener('click', async () => {
                    bookingStatusMsg.style.display = 'none';
                    bookingModal.style.display = 'flex';
                    await loadSavedAddresses();
                });

                btnRefreshAddresses.addEventListener('click', loadSavedAddresses);
                btnToggleAddressForm.addEventListener('click', () => {
                    bookingAddressForm.style.display = bookingAddressForm.style.display === 'none' ? 'block' : 'none';
                });
                btnSaveAddressInline.addEventListener('click', saveInlineAddress);

                const closeModal = () => {
                    bookingModal.style.display = 'none';
                };

                btnCloseHire.addEventListener('click', closeModal);
                btnCancelHire.addEventListener('click', closeModal);

                let isSubmitting = false;
                const handleBookingSubmit = async (e) => {
                    if (e && e.preventDefault) e.preventDefault();
                    if (isSubmitting) return;

                    const dateVal = bookingDateInput.value;
                    const slotVal = document.getElementById('booking-slot').value;
                    const priceVal = parseFloat(document.getElementById('booking-price').value);
                    const notesVal = document.getElementById('booking-notes').value.trim();

                    if (!dateVal) {
                        alert('Please choose a service date.');
                        return;
                    }

                    if (isNaN(priceVal) || priceVal <= 0) {
                        alert('Please enter a valid price.');
                        return;
                    }

                    isSubmitting = true;
                    btnSubmitBooking.disabled = true;
                    btnSubmitBooking.textContent = 'Submitting Booking...';
                    bookingStatusMsg.style.display = 'block';
                    bookingStatusMsg.style.background = 'rgba(59, 130, 246, 0.15)';
                    bookingStatusMsg.style.color = '#60a5fa';
                    bookingStatusMsg.style.border = '1px solid rgba(59, 130, 246, 0.3)';
                    bookingStatusMsg.textContent = 'Sending booking request to server...';

                    const selectedAddressId = bookingAddressSelect && bookingAddressSelect.value ? bookingAddressSelect.value : undefined;
                    const bookingPayload = {
                        workerId: worker.id || worker._id,
                        scheduledAt: new Date(dateVal + 'T10:00:00Z').toISOString(),
                        timeSlot: slotVal,
                        agreedPrice: priceVal,
                        notes: notesVal,
                        addressId: selectedAddressId
                    };

                    try {
                        const result = await window.localHireAPI.createBooking(bookingPayload);

                        if (result && result.success) {
                            bookingStatusMsg.style.background = 'rgba(34, 197, 94, 0.15)';
                            bookingStatusMsg.style.color = '#4ade80';
                            bookingStatusMsg.style.border = '1px solid rgba(34, 197, 94, 0.3)';
                            const bRef = result.booking && result.booking.bookingNumber ? ` (${result.booking.bookingNumber})` : '';
                            bookingStatusMsg.textContent = `✅ Booking request created${bRef}! Redirecting to dashboard...`;

                            setTimeout(() => {
                                window.location.href = 'my-jobs.html';
                            }, 1400);
                        } else {
                            isSubmitting = false;
                            btnSubmitBooking.disabled = false;
                            btnSubmitBooking.textContent = 'Confirm & Send Request';
                            bookingStatusMsg.style.background = 'rgba(239, 68, 68, 0.15)';
                            bookingStatusMsg.style.color = '#f87171';
                            bookingStatusMsg.style.border = '1px solid rgba(239, 68, 68, 0.3)';
                            bookingStatusMsg.textContent = `❌ ${result && result.message ? result.message : 'Booking failed. Database connection unavailable.'}`;
                        }
                    } catch (err) {
                        isSubmitting = false;
                        btnSubmitBooking.disabled = false;
                        btnSubmitBooking.textContent = 'Confirm & Send Request';
                        bookingStatusMsg.style.background = 'rgba(239, 68, 68, 0.15)';
                        bookingStatusMsg.style.color = '#f87171';
                        bookingStatusMsg.style.border = '1px solid rgba(239, 68, 68, 0.3)';
                        bookingStatusMsg.textContent = '❌ An unexpected error occurred while submitting the booking.';
                    }
                };

                bookingForm.addEventListener('submit', handleBookingSubmit);
                btnSubmitBooking.addEventListener('click', (e) => {
                    if (bookingForm.requestSubmit) {
                        bookingForm.requestSubmit();
                    } else {
                        handleBookingSubmit(e);
                    }
                });

                document.getElementById('btn-fav').addEventListener('click', () => {
                    window.localHireApp.toggleFavorite(currentUser.id, worker.id);
                    window.location.reload();
                });

                const profileCallBtn = document.getElementById('btn-profile-call');
                if (profileCallBtn) {
                    profileCallBtn.addEventListener('click', () => {
                        if (window.LocalHireCalling) {
                            window.LocalHireCalling.startCall({
                                name: worker.name,
                                role: worker.category || 'Service Professional',
                                phone: worker.phone || '+91 90000 00003',
                                avatarUrl: worker.avatarUrl
                            });
                        }
                    });
                }
            } else {
                actionContainer.innerHTML = `
                    <button class="btn btn-primary" onclick="window.location.href='auth.html'" style="width: 100%; padding: 1rem; font-size: 1.1rem;">
                        Sign in to Hire
                    </button>
                `;
            }

            } catch (error) {
                console.error('[Profile] Failed to render worker profile:', error);
                container.innerHTML = `<div class="glass-card" style="text-align: center; padding: 4rem;"><h2>Unable to load profile</h2><p class="text-muted" style="margin-top: 0.75rem;">The worker profile data is incomplete or the server is unavailable.</p><a href="${backHref}" class="btn btn-primary" style="margin-top: 1rem;">${backLabel}</a></div>`;
            }

        });
    </script>
</body>
</html>
