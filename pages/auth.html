<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LocalHire</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .auth-container {
            min-height: calc(100vh - 80px); /* rough navbar offset */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div id="navbar-container"></div>

    <div class="auth-container">
        <div class="glass-card animate-fade-in" style="width: 100%; max-width: 450px; padding: 3rem 2rem;">
            <div class="flex items-center justify-between" style="margin-bottom: 2rem;">
                <h2 id="auth-title" style="font-size: 1.8rem; margin: 0;">Welcome Back</h2>
                <div class="flex bg-card p-1 rounded-full" style="background: rgba(15, 23, 42, 0.6); border-radius: 9999px; padding: 4px;">
                    <button id="tab-login" class="btn" style="padding: 0.5rem 1.5rem; border-radius: 9999px; background: var(--primary); color: white;">Log In</button>
                    <button id="tab-signup" class="btn text-muted" style="padding: 0.5rem 1.5rem; border-radius: 9999px; background: transparent;">Sign Up</button>
                </div>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="input-group">
                    <label class="input-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="input-control" placeholder="you@example.com" required>
                </div>

                <div class="input-group" style="margin-top: 1.5rem;">
                    <div class="flex justify-between">
                        <label class="input-label" for="login-password">Password</label>
                        <a href="#" style="font-size: 0.85rem; color: var(--primary); text-decoration: none;">Forgot password?</a>
                    </div>
                    <input type="password" id="login-password" class="input-control" placeholder="••••••••" required>
                </div>
                
                <p id="login-error" class="text-muted" style="color: #ef4444; display: none; margin-top: 1rem; font-size: 0.875rem; text-align: center;"></p>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 2rem; padding: 1rem; font-size: 1.1rem;">
                    Sign In
                </button>
            </form>

            <!-- Signup Form (Hidden initially) -->
            <form id="signup-form" style="display: none;">
                <div class="input-group" style="margin-bottom: 1.5rem;">
                    <label class="input-label">I want to...</label>
                    <div class="grid grid-cols-2 gap-4">
                        <label class="glass-card flex items-center justify-center gap-2 cursor-pointer" style="padding: 1rem; border: 2px solid var(--primary); background: rgba(139, 92, 246, 0.1);">
                            <input type="radio" name="role" value="Customer" checked style="display: none;">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                            <span>Hire workers</span>
                        </label>
                        <label class="glass-card flex items-center justify-center gap-2 cursor-pointer" style="padding: 1rem; border: 1px solid var(--border-light); background: transparent;">
                            <input type="radio" name="role" value="Worker" style="display: none;">
                            <svg class="icon" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
                            <span>Find work</span>
                        </label>
                    </div>
                </div>

                <div class="input-group" style="margin-bottom: 1.5rem;">
                    <label class="input-label" for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" class="input-control" placeholder="John Doe" required>
                </div>

                <div class="input-group" style="margin-bottom: 1.5rem;">
                    <label class="input-label" for="signup-email">Email Address</label>
                    <input type="email" id="signup-email" class="input-control" placeholder="you@example.com" required>
                </div>

                <div class="input-group" style="margin-bottom: 1.5rem;">
                    <label class="input-label" for="signup-phone">Phone Number</label>
                    <input type="tel" id="signup-phone" class="input-control" placeholder="+91 98765 43210">
                </div>
                
                <div class="input-group">
                    <label class="input-label" for="signup-password">Password</label>
                    <input type="password" id="signup-password" class="input-control" placeholder="Create a password" required>
                </div>
                
                <p id="signup-error" class="text-muted" style="color: #ef4444; display: none; margin-top: 1rem; font-size: 0.875rem; text-align: center;"></p>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 2rem; padding: 1rem; font-size: 1.1rem;">
                    Create Account
                </button>
            </form>

            <div style="margin-top: 2rem; text-align: center;">
                <div style="margin: 1.5rem 0; position: relative; text-align: center;">
                    <div style="position: absolute; top: 50%; left: 0; right: 0; background: var(--border-light); height: 1px;"></div>
                    <span style="background: var(--bg-card); padding: 0 1rem; position: relative; color: var(--text-muted); font-size: 0.85rem;">Or continue with</span>
                </div>
                
                <button class="btn btn-outline" style="width: 100%; padding: 0.85rem;">
                    <svg class="icon" viewBox="0 0 24 24" style="margin-right: 0.5rem;"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
                    Google
                </button>
            </div>
        </div>
    </div>

    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('navbar-container', 'pages');

            const loginTab = document.getElementById('tab-login');
            const signupTab = document.getElementById('tab-signup');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const authTitle = document.getElementById('auth-title');

            const loginError = document.getElementById('login-error');
            const signupError = document.getElementById('signup-error');

            // Handle role selection styling
            const roleLabels = document.querySelectorAll('input[name="role"]');
            roleLabels.forEach(radio => {
                radio.addEventListener('change', (e) => {
                    document.querySelectorAll('input[name="role"]').forEach(r => {
                        const lbl = r.closest('label');
                        if (r.checked) {
                            lbl.style.border = '2px solid var(--primary)';
                            lbl.style.background = 'rgba(139, 92, 246, 0.1)';
                        } else {
                            lbl.style.border = '1px solid var(--border-light)';
                            lbl.style.background = 'transparent';
                        }
                    });
                });
            });

            // Tabs toggle
            loginTab.addEventListener('click', () => {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                authTitle.textContent = 'Welcome Back';
                
                loginTab.style.background = 'var(--primary)';
                loginTab.style.color = 'white';
                loginTab.classList.remove('text-muted');
                
                signupTab.style.background = 'transparent';
                signupTab.classList.add('text-muted');
                signupTab.style.color = '';
            });

            signupTab.addEventListener('click', () => {
                signupForm.style.display = 'block';
                loginForm.style.display = 'none';
                authTitle.textContent = 'Create Account';
                
                signupTab.style.background = 'var(--primary)';
                signupTab.style.color = 'white';
                signupTab.classList.remove('text-muted');
                
                loginTab.style.background = 'transparent';
                loginTab.classList.add('text-muted');
                loginTab.style.color = '';
            });

            // Submit Login
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                loginError.style.display = 'none';
                const email = document.getElementById('login-email').value;
                const pass = document.getElementById('login-password').value;
                
                const api = window.localHireAPI || {
                    login: async (em, pw) => window.localHireApp ? window.localHireApp.loginUser(em, pw) : { success: false }
                };
                const result = await api.login(email, pass);
                if (result && result.success) {
                    window.location.href = '../index.html';
                } else {
                    loginError.textContent = (result && result.message) ? result.message : 'Invalid credentials';
                    loginError.style.display = 'block';
                }
            });

            // Submit Signup
            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                signupError.style.display = 'none';
                
                const name = document.getElementById('signup-name').value;
                const email = document.getElementById('signup-email').value;
                const phone = document.getElementById('signup-phone').value;
                const pass = document.getElementById('signup-password').value;
                const role = document.querySelector('input[name="role"]:checked').value;

                const api = window.localHireAPI || {
                    register: async (data) => window.localHireApp ? window.localHireApp.registerUser(data) : { success: false }
                };
                const result = await api.register({ name, email, phone, password: pass, role });
                if (result && result.success) {
                    if (role === 'Worker') {
                        // After signing up, workers must fill out their profile
                        window.location.href = 'edit-profile.html'; 
                    } else {
                        window.location.href = '../index.html';
                    }
                } else {
                    signupError.textContent = (result && result.message) ? result.message : 'Registration failed';
                    signupError.style.display = 'block';
                }
            });
        });
    </script>
</body>
</html>
