<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile | LocalHire</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <div id="navbar-container"></div>

    <main class="container animate-fade-in" style="padding: 3rem 1.5rem; max-width: 800px; margin: 0 auto;">
        
        <div class="flex items-center justify-between" style="margin-bottom: 2rem;">
            <div>
                <h2>Set Up Your Profile</h2>
                <p class="text-muted">Complete your worker profile so customers can find and hire you.</p>
            </div>
        </div>

        <form id="profile-form" class="glass-card" style="padding: 2.5rem;">
            
            <div class="grid grid-cols-1 md-grid-cols-2 gap-6" style="margin-bottom: 2rem;">
                <div class="form-group">
                    <label class="form-label" for="category">Main Profession / Category</label>
                    <select id="category" class="input-control" required style="background-color: var(--bg-dark);">
                        <option value="">Select a category...</option>
                        <option value="Tutor">Tutor / Teacher</option>
                        <option value="Electrician">Electrician</option>
                        <option value="Plumber">Plumber</option>
                        <option value="Driver">Driver / Chauffeur</option>
                        <option value="Cleaner">Cleaner / Housekeeper</option>
                        <option value="Designer">Designer / Creative</option>
                        <option value="Handyman">Handyman</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="hourlyRate">Hourly Rate ($)</label>
                    <input type="number" id="hourlyRate" class="input-control" min="5" max="500" placeholder="e.g. 45" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="experience">Experience Level</label>
                    <select id="experience" class="input-control" required style="background-color: var(--bg-dark);">
                        <option value="">Select level...</option>
                        <option value="Entry (0-2 years)">Entry (0-2 years)</option>
                        <option value="Intermediate (3-5 years)">Intermediate (3-5 years)</option>
                        <option value="Expert (5+ years)">Expert (5+ years)</option>
                        <option value="Master (10+ years)">Master (10+ years)</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="phone">Phone Number (Optional)</label>
                    <input type="tel" id="phone" class="input-control" placeholder="(555) 123-4567">
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label class="form-label" for="skills">Skills (Comma separated)</label>
                <input type="text" id="skills" class="input-control" placeholder="e.g. Calculus, Physics, Exam Prep" required>
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label class="form-label" for="bio">About You / Bio</label>
                <textarea id="bio" class="input-control" rows="4" placeholder="Tell customers about your experience, approach, and why they should hire you..." required></textarea>
            </div>

            <div class="grid grid-cols-1 md-grid-cols-2 gap-6" style="margin-bottom: 3rem;">
                <div class="form-group">
                    <label class="form-label" for="availability">Availability</label>
                    <input type="text" id="availability" class="input-control" placeholder="e.g. Available Mon-Fri, or Available Today" required>
                </div>

                <div class="form-group relative">
                    <label class="form-label">Location (GPS)</label>
                    <div class="flex gap-2">
                        <button type="button" id="btn-getloc" class="btn btn-outline" style="flex-grow: 1;">
                            <svg class="icon" viewBox="0 0 24 24" style="margin-right: 8px;"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
                            Get My Location
                        </button>
                    </div>
                    <p id="loc-status" class="text-muted" style="font-size: 0.8rem; margin-top: 0.5rem;"></p>
                    <input type="hidden" id="lat" value="">
                    <input type="hidden" id="lng" value="">
                </div>
            </div>

            <div class="flex justify-end gap-3" style="border-top: 1px solid var(--border-light); padding-top: 2rem;">
                <a href="../index.html" class="btn btn-outline" style="padding: 0.8rem 2rem;">Cancel</a>
                <button type="submit" class="btn btn-primary" style="padding: 0.8rem 2rem;">Save Profile</button>
            </div>
            
            <p id="save-msg" style="display: none; color: #10b981; margin-top: 1rem; text-align: right;">Profile saved successfully!</p>
        </form>

    </main>

    <script src="../js/data.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderNavbar('navbar-container', 'pages');

            const user = window.localHireApp.getCurrentUser();
            
            if (!user) {
                window.location.href = 'auth.html';
                return;
            }

            if (user.role !== 'Worker') {
                alert("Only Workers need to set up public profiles.");
                window.location.href = '../index.html';
                return;
            }

            // Pre-fill existing data if any
            if (user.category) document.getElementById('category').value = user.category;
            if (user.hourlyRate) document.getElementById('hourlyRate').value = user.hourlyRate;
            if (user.experience) document.getElementById('experience').value = user.experience;
            if (user.phone) document.getElementById('phone').value = user.phone;
            if (user.skills && user.skills.length > 0) document.getElementById('skills').value = user.skills.join(', ');
            if (user.bio) document.getElementById('bio').value = user.bio;
            if (user.availability) document.getElementById('availability').value = user.availability;
            
            if (user.lat && user.lng) {
                document.getElementById('lat').value = user.lat;
                document.getElementById('lng').value = user.lng;
                document.getElementById('loc-status').textContent = "Location saved.";
                document.getElementById('loc-status').style.color = "#10b981";
            }

            // Location Logic
            const btnLoc = document.getElementById('btn-getloc');
            const locStatus = document.getElementById('loc-status');
            const latInput = document.getElementById('lat');
            const lngInput = document.getElementById('lng');

            btnLoc.addEventListener('click', () => {
                if (!navigator.geolocation) {
                    locStatus.textContent = 'Geolocation is not supported by your browser.';
                    return;
                }
                btnLoc.innerHTML = `<svg class="icon animate-spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg> Locating...`;
                
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        latInput.value = position.coords.latitude;
                        lngInput.value = position.coords.longitude;
                        locStatus.textContent = "Coordinates grabbed successfully.";
                        locStatus.style.color = "#10b981";
                        btnLoc.innerHTML = `<svg class="icon" viewBox="0 0 24 24" style="margin-right: 8px;"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg> Refresh Location`;
                    },
                    (error) => {
                        console.error(error);
                        locStatus.textContent = "Could not get location. Ensure permissions are granted.";
                        locStatus.style.color = "#ef4444";
                        btnLoc.innerHTML = `<svg class="icon" viewBox="0 0 24 24" style="margin-right: 8px;"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg> Get My Location`;
                    }
                );
            });

            // Form Submit
            const form = document.getElementById('profile-form');
            const saveMsg = document.getElementById('save-msg');
            const submitButton = form.querySelector('button[type="submit"]');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (submitButton.disabled) return;

                const updates = {
                    category: document.getElementById('category').value,
                    hourlyRate: parseFloat(document.getElementById('hourlyRate').value),
                    experience: document.getElementById('experience').value,
                    phone: document.getElementById('phone').value,
                    skills: document.getElementById('skills').value.split(',').map(s => s.trim()).filter(s => s),
                    bio: document.getElementById('bio').value,
                    availability: document.getElementById('availability').value,
                    lat: parseFloat(latInput.value) || null,
                    lng: parseFloat(lngInput.value) || null,
                    rating: user.rating || 5.0,
                    reviewsCount: user.reviewsCount || 1,
                    location: (latInput.value && lngInput.value) ? 'Local GPS coordinates set' : 'Remote'
                };

                submitButton.disabled = true;
                submitButton.textContent = 'Saving...';
                saveMsg.style.display = 'none';
                saveMsg.style.color = '#10b981';
                saveMsg.textContent = '';

                try {
                    if (!window.localHireAPI || typeof window.localHireAPI.updateProfile !== 'function') {
                        throw new Error('Profile API is unavailable.');
                    }

                    const result = await window.localHireAPI.updateProfile(updates);
                    if (!result || !result.success) {
                        throw new Error(result && result.message ? result.message : 'Could not update profile.');
                    }

                    saveMsg.textContent = 'Profile saved successfully!';
                    saveMsg.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = `profile.html?id=${user.id}`;
                    }, 1000);
                } catch (error) {
                    console.error('[Profile Page] Save failed:', error);
                    saveMsg.textContent = error && error.message ? error.message : 'Could not save profile. Please try again.';
                    saveMsg.style.display = 'block';
                    saveMsg.style.color = '#ef4444';
                } finally {
                    submitButton.disabled = false;
                    submitButton.textContent = 'Save Profile';
                }
            });
        });
    </script>
</body>
</html>
